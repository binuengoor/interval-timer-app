      name: Supine Wand Flexion (Shoulder)
      notes: >-
        Lie on your back and hold a wand or cane as pictured. Slowly raise the
        wand towards overhead. Use your unaffected arm to assist with the
        movement.
      sets: 2
      reps: 10
      workTime: 10
      restTime: 0
