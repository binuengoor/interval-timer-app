    - id: _ex003
      name: Shoulder Abduction Wall Slide with Towel
      notes: >-
        Don't use a towel. Stand to the side and with a straight arm slowly
        slide the arm up and down. Repeat for the desired number of reps.
      sets: 1
      reps: 5
      workTime: 30
      restTime: 0
