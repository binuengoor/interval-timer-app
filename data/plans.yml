    - id: _ex004
      name: Corner pec stretch
      notes: >-
        Stand facing the corner with your arms up and your elbows in line with
        your shoulders. Lean your body in towards the corner to feel a stretch.
      sets: 1
      reps: 5
      workTime: 30
      restTime: 0
      images:
        - >-
