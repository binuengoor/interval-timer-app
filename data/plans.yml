    - id: _ex005
      name: Sidelying Internal Rotation Stretch (Sleeper Stretch)
      notes: >-
        Lie on your side with the affected arm on the bottom. Use your
        unaffected arm to gently draw your affected forearm towards the table or
        bed.
      sets: 1
      reps: 5
      workTime: 30
      restTime: 0
